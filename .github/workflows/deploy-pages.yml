name: Deploy to Cloudflare Pages

# main push 는 운영(www.ajouevent.com), PR 은 미리보기 주소로 배포한다
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # REACT_APP_* 는 브라우저 번들에 그대로 들어가는 공개 설정값이라 Actions 변수(vars)로 관리한다
      - name: Build
        env:
          CI: false
          GENERATE_SOURCEMAP: false
          REACT_APP_BE_URL: ${{ vars.REACT_APP_BE_URL }}
          REACT_APP_FE_URL: ${{ vars.REACT_APP_FE_URL }}
          REACT_APP_VAPID_KEY: ${{ vars.REACT_APP_VAPID_KEY }}
          REACT_APP_FIREBASE_API_KEY: ${{ vars.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ vars.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ vars.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ vars.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ vars.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ vars.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_OAUTH_CLIENT_ID }}
          REACT_APP_GA_TRACKING_ID: ${{ vars.REACT_APP_GA_TRACKING_ID }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # 첫 배포에서 Pages 프로젝트를 만든다 (이미 있으면 무시)
          preCommands: npx wrangler pages project create ajouevent --production-branch=main || true
          command: pages deploy build --project-name=ajouevent --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
